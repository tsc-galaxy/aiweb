plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.tao'
version = '0.0.1-SNAPSHOT'
description = 'aitest'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
    maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
}

dependencyManagement {
    imports {
        mavenBom 'com.alibaba.cloud.ai:spring-ai-alibaba-bom:1.0.0.2'
        mavenBom 'org.springframework.ai:spring-ai-bom:1.0.0'
    }
}
dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    //implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    // 阿里云 DashScope
    implementation 'com.alibaba:dashscope-sdk-java:2.19.1'
    implementation 'com.alibaba.cloud.ai:spring-ai-alibaba-starter-dashscope'

    // Spring AI
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
    implementation 'org.springframework.ai:spring-ai-markdown-document-reader'
    implementation 'org.springframework.ai:spring-ai-pgvector-store'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-client'
    implementation 'org.springframework.ai:spring-ai-advisors-vector-store'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // LangChain4J
    implementation 'dev.langchain4j:langchain4j-community-dashscope:1.0.0-beta2'

    // 结构化输出
    implementation 'com.github.victools:jsonschema-generator:4.38.0'

    // 序列化
    implementation 'com.esotericsoftware:kryo:5.6.2'

    // HTML 解析
    implementation 'org.jsoup:jsoup:1.19.1'

    // PDF 生成
    implementation 'com.itextpdf:itext-core:9.1.0'

    // 工具类
    implementation 'cn.hutool:hutool-all:5.8.37'

    // API 文档
    implementation 'com.github.xiaoymin:knife4j-openapi3-jakarta-spring-boot-starter:4.4.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    // PostgreSQL
    //runtimeOnly 'org.postgresql:postgresql'

    // 测试
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.itextpdf:font-asian:9.1.0'
}

tasks.named('test') {
    useJUnitPlatform()
}
